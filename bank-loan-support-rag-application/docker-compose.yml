# Local stack: 4 serving microservices + Redis Stack (semantic cache) + Prometheus + Grafana.
#   cp .env.example .env   # add PINECONE_API_KEY, GROQ_API_KEY (+ optional GOOGLE_API_KEY, LANGFUSE_*)
#   python scripts/download_pdfs.py
#   docker compose run --rm ingestion          # incremental CDC load into Pinecone
#   docker compose up -d                       # http://localhost:8000
x-common: &common
  env_file: .env
  restart: unless-stopped
  environment: &env
    ENVIRONMENT: local
    RETRIEVER_URL: http://retriever:8080
    GENERATOR_URL: http://generator:8080
    GUARDRAIL_URL: http://guardrail:8080
    CHUNK_STORE_URI: /app/data/state/chunks.jsonl
    CDC_STATE_URI: /app/data/state/cdc_state.json
    PDF_SOURCE_URI: /app/data/pdfs
    MARKDOWN_OUT_DIR: /app/data/markdown
    RETRIEVAL_LOG_PATH: /app/data/logs/retrievals.jsonl

services:
  retriever:
    <<: *common
    build: { context: ., dockerfile: services/retriever/Dockerfile }
    ports: ["8001:8080"]
    volumes: ["./data:/app/data"]

  generator:
    <<: *common
    build: { context: ., dockerfile: services/generator/Dockerfile }
    ports: ["8002:8080"]

  guardrail:
    <<: *common
    build: { context: ., dockerfile: services/guardrail/Dockerfile }
    ports: ["8003:8080"]

  gateway:
    <<: *common
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8000:8080"]
    environment:
      <<: *env
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on: [retriever, generator, guardrail, redis]

  ingestion:
    <<: *common
    build: { context: ., dockerfile: services/ingestion/Dockerfile }
    volumes: ["./data:/app/data"]
    restart: "no"
    profiles: ["jobs"]

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
