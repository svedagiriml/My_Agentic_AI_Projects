# Builds the five images in parallel and pushes them to Artifact Registry.
# gcloud builds submit --config deploy/gcp/cloudbuild.yaml --substitutions=_REGION=asia-south1,_REPO=bank-rag,_TAG=v1 .
substitutions:
  _REGION: asia-south1
  _REPO: bank-rag
  _TAG: latest
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: tests
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements/dev.txt && python -m pytest -q"]
  - { id: retriever, waitFor: [tests], name: gcr.io/cloud-builders/docker,
      args: [build, -f, services/retriever/Dockerfile, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/retriever:${_TAG}", .] }
  - { id: generator, waitFor: [tests], name: gcr.io/cloud-builders/docker,
      args: [build, -f, services/generator/Dockerfile, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/generator:${_TAG}", .] }
  - { id: guardrail, waitFor: [tests], name: gcr.io/cloud-builders/docker,
      args: [build, -f, services/guardrail/Dockerfile, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/guardrail:${_TAG}", .] }
  - { id: gateway, waitFor: [tests], name: gcr.io/cloud-builders/docker,
      args: [build, -f, services/gateway/Dockerfile, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}", .] }
  - { id: ingestion, waitFor: [tests], name: gcr.io/cloud-builders/docker,
      args: [build, -f, services/ingestion/Dockerfile, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ingestion:${_TAG}", .] }
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/retriever:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/generator:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/guardrail:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:${_TAG}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/ingestion:${_TAG}"
