# CI/CD on Cloud Build: unit + integration tests -> offline golden-set eval gate -> build -> deploy
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements/dev.txt && pip install -q ./libs/bankcore && pytest -q"]
  - id: eval-gate
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements/dev.txt && pip install -q ./libs/bankcore && python eval/run_eval.py --offline"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ["deploy/cloudrun/deploy.sh"]
    env: ["PROJECT=$PROJECT_ID", "REGION=asia-south1", "TAG=$SHORT_SHA",
          "REDIS_URL=${_REDIS_URL}", "CLOUDSQL_INSTANCE=${_CLOUDSQL_INSTANCE}"]
substitutions: { _REDIS_URL: "redis://10.0.0.3:6379/0", _CLOUDSQL_INSTANCE: "my-project:asia-south1:bank-pg" }
options: { logging: CLOUD_LOGGING_ONLY }
timeout: 3600s
