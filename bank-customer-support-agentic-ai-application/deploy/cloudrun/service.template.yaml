# Declarative (Knative) Cloud Run spec for one sub-agent — rendered per agent with envsubst:
#   AGENT=payments IMAGE=... PROJECT=... MCP_URL=... envsubst < service.template.yaml | gcloud run services replace -
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agent-${AGENT}
  labels: { app: bank-agentic, tier: subagent }
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"        # keep CPU for async work between requests
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/vpc-access-connector: bank-connector
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: agent-${AGENT}@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports: [{ containerPort: 8080 }]
          resources: { limits: { cpu: "1", memory: 1Gi } }
          env:
            - { name: SERVICE, value: agent }
            - { name: AGENT_NAME, value: "${AGENT}" }
            - { name: ENVIRONMENT, value: production }
            - { name: SERVICE_AUTH_MODE, value: gcp }
            - { name: MCP_URLS, value: '{"${AGENT}": "${MCP_URL}"}' }
            - name: HANDOFF_HMAC_SECRET
              valueFrom: { secretKeyRef: { name: handoff-secret, key: latest } }
            - name: DELEGATION_SECRET
              valueFrom: { secretKeyRef: { name: delegation-secret, key: latest } }
          startupProbe: { httpGet: { path: /healthz }, initialDelaySeconds: 2, periodSeconds: 3, failureThreshold: 20 }
          livenessProbe: { httpGet: { path: /healthz }, periodSeconds: 30 }
