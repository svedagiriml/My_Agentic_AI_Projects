[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankcore"
version = "1.0.0"
description = "Shared core library for the multi-agent bank customer-support platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langchain-core>=0.3.30",
  "langgraph>=0.4",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "langchain-groq>=0.2",
  "mcp>=1.9",
  "httpx>=0.27",
  "redis>=5.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pyjwt>=2.8",
  "tenacity>=8.3",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "langfuse>=2.50",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",   # free local embeddings (BAAI/bge-small-en-v1.5)
  "transformers>=4.44",           # optional prompt-injection classifier
  "presidio-analyzer>=2.2",       # optional NER-based PII detection
  "presidio-anonymizer>=2.2",
]
gcp = [
  "google-auth>=2.30",
  "google-cloud-pubsub>=2.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bankcore*"]
